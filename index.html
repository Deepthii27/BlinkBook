<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Our Trips</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=DM+Sans:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="gate" class="gate" hidden>
      <div class="gate-card">
        <p class="stamp">Private album</p>
        <h1>Our trips</h1>
        <form id="stepCode" autocomplete="off">
          <label for="code">Enter the passcode</label>
          <input id="code" type="password" inputmode="numeric" autocomplete="off" />
          <button class="btn" type="submit">Continue</button>
        </form>
        <form id="stepName" autocomplete="off" hidden>
          <label for="name">Who's there?</label>
          <input id="name" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" />
          <button class="btn" type="submit">Open the album</button>
        </form>
        <p id="gateMsg" class="msg" role="alert"></p>
      </div>
    </section>

    <div id="app" hidden>
      <header class="top">
        <a href="#/" class="brand">Our trips</a>
        <div><span id="who"></span><button class="ghost" id="signout" type="button">Sign out</button></div>
      </header>
      <main id="view"></main>
    </div>

    <p id="toast" class="toast" role="status" hidden></p>

    <dialog id="tripDlg">
      <form id="tripForm">
        <h2>New trip</h2>
        <label>Trip name<input name="title" type="text" required maxlength="80" placeholder="Goa with the gang" /></label>
        <label>Place<input name="place" type="text" maxlength="80" placeholder="Goa, India" /></label>
        <div class="row">
          <label>From<input name="start" type="date" /></label>
          <label>To<input name="end" type="date" /></label>
        </div>
        <div class="dlg-actions">
          <button class="ghost" id="tripCancel" type="button">Cancel</button>
          <button class="btn" type="submit">Create trip</button>
        </div>
      </form>
    </dialog>

    <dialog id="lb">
      <button class="ghost light" id="lbClose" type="button" aria-label="Close">Close</button>
      <img id="lbImg" alt="" />
      <input id="lbCap" type="text" maxlength="140" placeholder="Add a caption" aria-label="Caption" />
      <div class="lb-bar">
        <button class="ghost light" id="lbPrev" type="button">Prev</button>
        <span id="lbMeta"></span>
        <button class="ghost light" id="lbNext" type="button">Next</button>
        <button class="ghost light" id="lbDel" type="button">Delete</button>
      </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
    <script src="./app.js"></script>
  </body>
</html>
